name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.9
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  mac-arm64:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag such as v0.1.9."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Check version and build architecture
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "The tag must match package.json."
            exit 1
          fi
          if [[ "$(node -p "process.platform + '-' + process.arch")" != "darwin-arm64" ]]; then
            echo "This release requires a native macOS ARM64 runner."
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test

      - name: Build desktop packages
        run: npm run package:mac -- --arm64 -c.mac.identity=- -c.mac.notarize=false

      - name: Verify the packaged runtime in an isolated profile
        run: npm run verify:desktop -- "release/mac-arm64/Agent Control Desk.app"

      - name: Build the CLI package
        run: npm pack --pack-destination release

      - name: Generate checksums
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd release
          shasum -a 256 \
            "Agent-Control-Desk-$PACKAGE_VERSION-mac-arm64.dmg" \
            "Agent-Control-Desk-$PACKAGE_VERSION-mac-arm64.zip" \
            "agent-control-desk-$PACKAGE_VERSION.tgz" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Publish the verified test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$DRAFT" != "true" ]]; then
              echo "This release is already published. Create a new version instead of replacing its files."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag --draft --prerelease --latest=false \
              --title "ACD $PACKAGE_VERSION" --generate-notes
          fi

          gh release edit "$RELEASE_TAG" \
            --draft --prerelease --title "ACD $PACKAGE_VERSION" \
            --notes "Test release for Mac Apple Silicon (M1 or later). The app is ad-hoc signed and is not notarized by Apple. Download a DMG or ZIP, or use the CLI tarball with Node.js 22.13.0 or later. Verify downloads with SHA256SUMS. See README and docs/distribution.md for installation and upgrade instructions."

          gh release upload "$RELEASE_TAG" \
            "release/Agent-Control-Desk-$PACKAGE_VERSION-mac-arm64.dmg" \
            "release/Agent-Control-Desk-$PACKAGE_VERSION-mac-arm64.zip" \
            "release/agent-control-desk-$PACKAGE_VERSION.tgz" \
            release/SHA256SUMS --clobber

          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
